name: CI

# Checks of this repository itself: workflow lint, supply chain and the tests of the shared scripts.
# GitHub-hosted runners: nothing here needs the LAN.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fixture caller: the healthy path of the reusable preflight, called the way a consumer calls it.
  preflight:
    name: Fixture caller (preflight)
    uses: ./.github/workflows/preflight.yml
    with:
      required-tools: "git"
      min-memory-mb: 512
      min-disk-mb: 512

  # Fixture caller of the change detection, on the real pull request or push event.
  changes:
    name: Fixture caller (changes)
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
    with:
      filters: '{"workflows":[".github/**"],"tests":["tests/**"],"docs":["*.md","LICENSE"]}'

  tests:
    name: Tests and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Preflight script tests
        run: bash tests/preflight.test.sh

      - name: Gate script tests
        run: bash tests/gate.test.sh

      - name: Changes script tests
        run: bash tests/changes.test.sh

      - name: Supply-chain workflow tests
        run: bash tests/supply-chain.test.sh

      - name: Merge train tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

  # Fixture caller of the reusable supply-chain scan, on the real event: this repository scans itself
  # with the same file its consumers call.
  supply-chain:
    name: Fixture caller (supply chain)
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml

  # The only check a branch rule would need to require. Fixture caller of the reusable gate.
  gate:
    name: Gate
    if: ${{ always() }}
    needs: [preflight, changes, tests, supply-chain]
    uses: ./.github/workflows/gate.yml
    with:
      needs-json: ${{ toJSON(needs) }}
